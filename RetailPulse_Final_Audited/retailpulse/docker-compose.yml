services:
  dashboard:
    build: .
    ports: ["8501:8501"]
    volumes:
      - ./reports:/app/reports
      - ./models:/app/models
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:/mlruns
    ports: ["5000:5000"]
    volumes:
      - ./models/mlruns:/mlruns
