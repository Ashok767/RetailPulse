# Every value here is read by the code (src/retailpulse/config.py). Missing keys fall back to the defaults in config.py.
seed: 42
data:
  n_customers: 1500
  n_days: 730
  start_date: "2024-10-01"
forecast:
  horizon_days: 28
  use_prophet: true      # optional benchmark, skipped automatically if prophet is not installed
  use_lstm: true         # optional benchmark, skipped automatically if tensorflow is not installed
  lstm_window: 28
  lstm_epochs: 15
churn:
  label_window_days: 60  # churned = no order in the 60 days after the snapshot
  active_window_days: 90 # only customers with an order in the last 90 days are scored
inventory:
  service_level: 0.95
  review_period_days: 7
  ordering_cost: 50      # cost of placing one order (for EOQ)
  holding_rate: 0.20     # yearly holding cost as a share of unit cost (for EOQ)
monitoring:
  psi_warn: 0.10
  psi_major: 0.25
